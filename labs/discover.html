<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 灵感生成器 | 北辰青年 AI 实习</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    .lab-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px;
      background: linear-gradient(135deg, #E8EDFF 0%, #FFF0E8 50%, #E6FFF7 100%);
      position: relative;
      overflow: hidden;
    }
    .lab-hero::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border: 3px solid #4361EE; border-radius: 50%;
      top: -100px; right: -100px; opacity: 0.2;
    }
    .lab-hero::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border: 3px solid #FF6B35;
      bottom: -50px; left: -50px; opacity: 0.2;
      transform: rotate(15deg);
    }
    .lab-label {
      display: inline-block;
      font-size: 13px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: #4361EE;
      border: 2px solid #4361EE; padding: 6px 16px;
      border-radius: 999px; margin-bottom: 24px;
      position: relative; z-index: 2;
    }
    .lab-title {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 900; text-align: center;
      line-height: 1.1; letter-spacing: -0.03em;
      margin-bottom: 16px; position: relative; z-index: 2;
    }
    .lab-title .accent { color: #4361EE; }
    .lab-subtitle {
      font-size: 18px; color: #666; text-align: center;
      max-width: 500px; margin-bottom: 40px; position: relative; z-index: 2;
    }
    .input-area {
      width: 100%; max-width: 560px; position: relative; z-index: 2;
    }
    .input-row {
      display: flex; gap: 12px; margin-bottom: 16px;
    }
    .keyword-input {
      flex: 1; padding: 16px 20px;
      border: 2px solid #1a1a2e; border-radius: 12px;
      font-size: 16px; font-family: inherit;
      background: #fff; outline: none;
      transition: box-shadow 0.2s;
    }
    .keyword-input:focus {
      box-shadow: 4px 4px 0 #1a1a2e;
    }
    .generate-btn {
      padding: 16px 28px;
      background: #1a1a2e; color: #fff;
      border: 2px solid #1a1a2e; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .generate-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 #1a1a2e;
    }
    .generate-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    .quick-tags {
      display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: center;
    }
    .quick-tag {
      padding: 8px 16px;
      background: #fff; border: 2px solid #1a1a2e;
      border-radius: 999px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .quick-tag:hover {
      background: #1a1a2e; color: #fff;
      transform: translateY(-2px);
    }
    .results-area {
      width: 100%; max-width: 640px;
      margin-top: 40px; position: relative; z-index: 2;
    }
    .idea-card {
      background: #fff;
      border: 2px solid #1a1a2e;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 12px;
      display: flex; gap: 16px; align-items: flex-start;
      opacity: 0; transform: translateY(20px);
      animation: slideIn 0.5s forwards;
      transition: all 0.2s;
    }
    .idea-card:hover {
      transform: translateY(-2px);
      box-shadow: 4px 4px 0 #1a1a2e;
    }
    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .idea-num {
      width: 32px; height: 32px; min-width: 32px;
      background: #4361EE; color: #fff;
      border-radius: 8px; display: flex;
      align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px;
    }
    .idea-text {
      font-size: 15px; line-height: 1.7; color: #333;
    }
    .card-actions {
      margin-top: 24px;
      display: flex; gap: 12px; justify-content: center;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 12px 24px;
      border: 2px solid #1a1a2e; border-radius: 12px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; background: #fff;
    }
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 3px 3px 0 #1a1a2e;
    }
    .action-btn.primary {
      background: #FF6B35; color: #fff;
    }
    .loading {
      text-align: center; padding: 40px;
      font-size: 18px; color: #666;
    }
    .loading-dots span {
      animation: dot 1.4s infinite;
      display: inline-block;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }
    .back-link {
      position: fixed; top: 80px; left: 24px;
      z-index: 100; padding: 8px 16px;
      background: #fff; border: 2px solid #1a1a2e;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      text-decoration: none; color: #1a1a2e;
      transition: all 0.2s;
    }
    .back-link:hover {
      background: #1a1a2e; color: #fff;
    }
    @media(max-width:600px) {
      .input-row { flex-direction: column; }
      .generate-btn { width: 100%; }
      .back-link { top: 72px; left: 12px; }
    }
  </style>
</head>
<body>

  <a href="../index.html" class="back-link">← 返回</a>

  <div class="lab-hero">
    <span class="lab-label">实验室 01 / 认识 AI</span>
    <h1 class="lab-title">AI <span class="accent">灵感</span>生成器</h1>
    <p class="lab-subtitle">输入一个词，AI 给你 5 个可以立刻试试的创意。<br>看看 AI 能帮你做什么。</p>

    <div class="input-area">
      <div class="input-row">
        <input type="text" class="keyword-input" id="keywordInput" placeholder="你在想什么？比如：学习、生活、创作、迷茫..." maxlength="20">
        <button class="generate-btn" id="generateBtn">生成灵感 ✨</button>
      </div>
      <div class="quick-tags">
        <span class="quick-tag" data-keyword="学习">📚 学习</span>
        <span class="quick-tag" data-keyword="生活">🌱 生活</span>
        <span class="quick-tag" data-keyword="创作">🎨 创作</span>
        <span class="quick-tag" data-keyword="迷茫">🌙 迷茫</span>
        <span class="quick-tag" data-keyword="效率">⚡ 效率</span>
      </div>
    </div>

    <div class="results-area" id="resultsArea"></div>
  </div>

  <script src="../assets/data/ideas.js"></script>
  <script>
    const input = document.getElementById('keywordInput');
    const btn = document.getElementById('generateBtn');
    const results = document.getElementById('resultsArea');
    let currentIdeas = [];
    let currentKeyword = '';

    function matchCategory(keyword) {
      const k = keyword.toLowerCase();
      const map = {
        '学习': '学习', '学': '学习', '考试': '学习', '复习': '学习', '读书': '学习',
        '生活': '生活', '日常': '生活', '吃': '生活', '玩': '生活',
        '创作': '创作', '写': '创作', '画': '创作', '设计': '创作', '创意': '创作',
        '迷茫': '迷茫', '焦虑': '迷茫', '未来': '迷茫', '选择': '迷茫', '不知道': '迷茫',
        '效率': '效率', '工作': '效率', '时间': '效率', '拖延': '效率'
      };
      for (let key in map) {
        if (k.includes(key)) return map[key];
      }
      return '默认';
    }

    function generateIdeas() {
      const keyword = input.value.trim() || '默认';
      currentKeyword = keyword;
      const category = matchCategory(keyword);
      const pool = IDEA_LIBRARY[category] || IDEA_LIBRARY['默认'];

      // 随机选5个
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      currentIdeas = shuffled.slice(0, 5);

      // 显示加载
      results.innerHTML = '<div class="loading"><span class="loading-dots">AI 正在想<span>.</span><span>.</span><span>.</span></span></div>';

      // 模拟生成延迟
      setTimeout(() => {
        results.innerHTML = '';
        currentIdeas.forEach((idea, i) => {
          const card = document.createElement('div');
          card.className = 'idea-card';
          card.style.animationDelay = (i * 0.15) + 's';
          card.innerHTML = `
            <div class="idea-num">${i + 1}</div>
            <div class="idea-text">${idea}</div>
          `;
          results.appendChild(card);
        });

        // 操作按钮
        const actions = document.createElement('div');
        actions.className = 'card-actions';
        actions.innerHTML = `
          <button class="action-btn" onclick="generateIdeas()">🔄 换一批</button>
          <button class="action-btn primary" onclick="generateShareCard()">📸 生成分享卡片</button>
        `;
        results.appendChild(actions);
      }, 800);
    }

    function generateShareCard() {
      // 跳转到分享卡片页面，传递数据
      const data = {
        type: 'inspiration',
        keyword: currentKeyword,
        ideas: currentIdeas,
        template: Math.floor(Math.random() * CARD_TEMPLATES.length)
      };
      sessionStorage.setItem('shareData', JSON.stringify(data));
      window.location.href = 'share.html';
    }

    btn.addEventListener('click', generateIdeas);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateIdeas();
    });

    document.querySelectorAll('.quick-tag').forEach(tag => {
      tag.addEventListener('click', () => {
        input.value = tag.dataset.keyword;
        generateIdeas();
      });
    });

    // 页面加载时自动生成一次
    window.addEventListener('load', () => {
      input.value = '创作';
      generateIdeas();
    });
  </script>
</body>
</html>
